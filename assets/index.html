<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry Catalog — Read Only</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><main><header><h1>Foundry Catalog</h1><p>Discover pinned catalog sources. No install or change operations are available.</p></header>
<section><label for="token">Read-only access token (kept in page memory)</label><div class="controls"><input id="token" type="password" autocomplete="off" spellcheck="false"><button id="connect" type="button">View catalog</button><button id="clear" type="button">Clear access</button></div><p role="status" id="status" aria-live="polite">Not connected</p></section>
<section><h2>Published app sources</h2><div id="catalog" aria-live="polite"></div></section><footer>Discovery is not authorization to install. Source or version changes do not transfer ownership.</footer></main></body></html>
