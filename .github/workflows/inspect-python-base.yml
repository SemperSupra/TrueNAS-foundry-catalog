name: Inspect Python base OCI identity
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-python-base.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect candidate official Python image index (no build/push)
        run: |
          docker buildx version
          docker buildx imagetools inspect docker.io/library/python:3.13-slim-bookworm
          echo "The image tag is mutable; preserve the full Digest line in the qualification evidence and select that exact digest in a follow-up commit."
